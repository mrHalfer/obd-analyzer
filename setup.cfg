[isort]
profile = black
line_length = 100
known_first_party = core_obd,translation,build_html,build_pdf,build_png,build_csv,build_plotly,build_map,build_geojson,check_catalyst,check_coolant,check_knock,compare_core,compare_csv,compare_png,compare_plotly,compare_html,compare_pdf,compare_xls
known_third_party = pandas,numpy,matplotlib,plotly,jinja2,reportlab,openpyxl
# Блоки sys.path-манипуляций помечены как _sys/_Path — isort их не затрагивает
force_sort_within_sections = True
skip_glob =

[flake8]
max-line-length = 100
extend-ignore =
    # Пробелы вокруг оператора (black форматирует иначе)
    E203,
    # Перенос строки перед бинарным оператором
    W503,
    # Модуль импортирован, но не используется — false positives в __init__-like файлах
    F401,
per-file-ignores =
    # Тесты могут использовать assert без msg и длинные строки
    tests/*:E501

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
# Локальные модули добавлены в путь через sys.path в рантайме
follow_imports = silent
