repos:
  # ── Базовые хуки ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Форматирование: black ──────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]
        # Файлы с sys.path-манипуляциями — black их не ломает, только форматирует
        exclude: ^(render|plugins|compare)/.*\.py$   # опционально: убрать, если black нужен везде

  # ── Сортировка импортов: isort ─────────────────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: [--settings-path=setup.cfg]
        # Файлы с sys.path-блоком между импортами нужно проверять вручную;
        # ставьте "# isort: split" перед блоком манипуляций если хотите строгий режим
        exclude: ^(render|plugins|compare)/.*\.py$

  # ── Линтинг: flake8 ────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--config=setup.cfg]
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions

  # ── Проверка типов: mypy ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--config-file=setup.cfg, --ignore-missing-imports]
        # Анализируем только корневой файл и тесты; render/plugins требуют sys.path
        files: ^(analyze_obd\.py|core_obd\.py|translation\.py|tests/.*\.py)$
        additional_dependencies:
          - pandas-stubs
          - types-tqdm
